<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Деберц</title>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#78350F"/>
      <stop offset="45%"  stop-color="#FCD34D"/>
      <stop offset="55%"  stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="77" fill="#0A1A0C"/>

  <!-- gold border -->
  <rect x="15" y="15" width="482" height="482"
        rx="62" fill="none"
        stroke="url(#gold)" stroke-width="13"/>

  <!-- letter Д -->
  <text x="256" y="387"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="bold"
        font-size="317"
        text-anchor="middle"
        fill="url(#letter)">Д</text>
</svg>